<div class="nav-search" role="search">
  <i aria-hidden="true" class="bi bi-search nav-search-icon"></i>
  <input #input (input)="query = input.value" (keydown.enter)="submit()" (keydown.escape)="clear()"
         [value]="query" aria-label="Search" autocomplete="off" class="nav-search-input" placeholder="Search…"
         spellcheck="false" type="search">
  <kbd *ngIf="!query" aria-hidden="true" class="nav-search-kbd">{{ shortcutLabel }}</kbd>
</div>
