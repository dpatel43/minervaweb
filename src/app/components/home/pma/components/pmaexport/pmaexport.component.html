<div class="report-page">
  <div class="page-header">
    <h1>PMA Export</h1>
  </div>

  <form (ngSubmit)="onSubmit()" [formGroup]="exportForm" class="card filter-bar">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-auto filter-field">
          <label class="form-label" for="account">Account</label>
          <app-minerva-auto-complete [cacheName]="'accountCache'" formControlName="account" inputId="account"
                                     placeholder="Search account" required>
          </app-minerva-auto-complete>
        </div>
        <div class="col-auto filter-field">
          <label class="form-label" for="profile">Profile</label>
          <app-minerva-auto-complete [cacheName]="'profileCache'" formControlName="profile" inputId="profile"
                                     placeholder="Search profile" required>
          </app-minerva-auto-complete>
        </div>
        <div class="col-auto filter-field-sm">
          <label class="form-label" for="end">As of date</label>
          <div class="input-group flex-nowrap date-input">
            <input [matDatepicker]="picker" class="form-control" formControlName="end" id="end"
                   placeholder="MM/DD/YYYY">
            <mat-datepicker-toggle [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </div>
        </div>
        <div class="col-auto">
          <button [disabled]="!canRetrieve || loading" class="btn btn-primary" type="submit">
            <span *ngIf="loading" aria-hidden="true" class="spinner-border spinner-border-sm me-1"></span>
            Retrieve
          </button>
        </div>
      </div>
    </div>
  </form>

  <div class="card results-card">
    <div *ngIf="dataSource" class="card-header results-toolbar">
      <div class="input-group table-filter">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input #filterInput (input)="onFilterChange(filterInput.value)" [value]="filterText" aria-label="Filter rows"
               class="form-control" placeholder="Filter by name" type="search">
        <button (click)="clearFilter()" *ngIf="filterText" aria-label="Clear filter" class="btn btn-outline-secondary"
                type="button"><i class="bi bi-x-lg"></i></button>
      </div>
      <span class="text-body-secondary">
        <ng-container *ngIf="filterText; else allRows">{{ visibleRows }} of {{ totalRows }} rows</ng-container>
        <ng-template #allRows>{{ totalRows }} rows</ng-template>
      </span>
    </div>
    <div class="card-body">
      <div *ngIf="!dataSource" class="results-empty">
        Choose an account, profile and date, then select Retrieve.
      </div>

      <table *ngIf="dataSource" [dataSource]="dataSource" [style.width.px]="totalWidth"
             (matSortChange)="onSortChange($event)" class="grid-lines resizable-table" mat-table matSort>
        <colgroup>
          <col *ngFor="let c of displayedColumns" [style.width.px]="columnWidths[c]">
        </colgroup>
        <ng-container matColumnDef="name">
          <th *matHeaderCellDef [appColumnResize]="columnWidths" (resized)="saveColumnWidths()" columnKey="name"
              mat-header-cell mat-sort-header>Name</th>
          <td *matCellDef="let data" mat-cell>
            <div [style.paddingLeft.px]="data.level * 16" class="tree-cell">
              <button (click)="toggle(data)" [attr.aria-label]="'Toggle ' + data.name"
                      [class.invisible]="!data.expandable" class="tree-toggle" type="button">
                <i [class.bi-chevron-down]="treeControl.isExpanded(data)"
                   [class.bi-chevron-right]="!treeControl.isExpanded(data)" class="bi"></i>
              </button>
              <span [title]="data.name" class="text-truncate">{{ data.name }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container *ngFor="let period of periods" [matColumnDef]="period.key">
          <th *matHeaderCellDef [appColumnResize]="columnWidths" [columnKey]="period.key" (resized)="saveColumnWidths()"
              arrowPosition="before" class="num" mat-header-cell mat-sort-header>{{ period.label }}</th>
          <td *matCellDef="let data" mat-cell
              [class.negative]="data.pmaExportRow.accountValues[period.key]?.BaseTotalRor < 0"
              class="num">
            {{ data.pmaExportRow.accountValues[period.key]?.BaseTotalRor | number:'.3-3' }}
          </td>
        </ng-container>

        <tr *matHeaderRowDef="displayedColumns; sticky: true" mat-header-row></tr>
        <tr *matNoDataRow class="mat-mdc-row">
          <td [attr.colspan]="displayedColumns.length" class="mat-mdc-cell results-empty">
            No rows match "{{ filterText }}".
          </td>
        </tr>
        <tr *matRowDef="let row; columns: displayedColumns;" [class.tree-parent]="row.expandable"
            [class.tree-root]="row.level === 0" mat-row></tr>
      </table>
    </div>
  </div>
</div>
