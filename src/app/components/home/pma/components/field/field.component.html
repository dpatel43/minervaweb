<div class="report-page">
  <div *ngIf="detail" class="detail-toolbar">
    <button (click)="list()" class="btn btn-outline-secondary" type="button">
      <i class="bi bi-arrow-left me-1"></i>Back to list
    </button>
    <span class="detail-title">{{ field?.fieldId ? (field.name || 'Field ' + field.fieldId) : 'New field' }}</span>
    <div class="ms-auto d-flex gap-2">
      <button (click)="reload()" [disabled]="!field?.fieldId" class="btn btn-outline-secondary"
              title="Discard changes and load the saved field again" type="button">
        <i class="bi bi-arrow-clockwise me-1"></i>Reload
      </button>
      <button (click)="save()" class="btn btn-primary" type="button">
        <i class="bi bi-check-lg me-1"></i>Save
      </button>
    </div>
  </div>

  <div *ngIf="!detail" class="card results-card fit-content">
    <form (ngSubmit)="retrieve()" class="card-header results-toolbar">
      <div class="input-group table-filter">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input [(ngModel)]="searchText" aria-label="Search fields by name" class="form-control" name="search"
               placeholder="Search by name" type="search">
      </div>
      <button class="btn btn-outline-primary" type="submit">Search</button>
      <button (click)="createNew()" class="btn btn-primary ms-auto" type="button">
        <i class="bi bi-plus-lg me-1"></i>New field
      </button>
    </form>
    <div class="card-body d-flex flex-column">
      <app-field-list></app-field-list>
    </div>
  </div>

  <app-field-detail *ngIf="detail"></app-field-detail>
</div>
