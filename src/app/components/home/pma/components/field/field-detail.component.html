<div class="detail-page">
  <div class="card">
    <div class="card-header">General</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-6 col-md-2">
          <label class="form-label" for="fieldId">ID</label>
          <input [value]="field.fieldId || 'New'" class="form-control" id="fieldId" readonly tabindex="-1">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="name">Name <span class="text-danger">*</span></label>
          <input #nameModel="ngModel" [(ngModel)]="field.name" [class.is-invalid]="nameModel.invalid && nameModel.touched"
                 class="form-control" id="name" name="name" placeholder="Field name" required>
          <div class="invalid-feedback">Name is required</div>
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label" for="fieldType">Type</label>
          <app-minerva-cache-select [(ngModel)]="field.fieldType" [cacheGroup]="'FIELD_TYPE'"
                                    inputId="fieldType"></app-minerva-cache-select>
        </div>
      </div>
    </div>
  </div>

  <app-time-field *ngIf="field.fieldType === 'TIME'" [field]="field"></app-time-field>
  <app-transaction-field *ngIf="field.fieldType === 'TRANSACTION'" [field]="field"></app-transaction-field>
</div>
