<nav class="navbar navbar-expand-sm app-navbar" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand app-brand" routerLink="/home" aria-label="Minerva home">
      <img alt="" class="app-brand-mark" src="assets/brand/minerva-mark-reverse.svg">
      <span class="app-brand-name">Minerva</span>
    </a>
    <button aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"
            class="navbar-toggler"
            data-bs-target="#navbarSupportedContent" data-bs-toggle="collapse" type="button">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto">
        <li *ngFor="let moduleGroup of moduleGroups; let i = index" class="nav-item dropdown">
          <a [attr.id]="'moduleGroup' + i" aria-expanded="false" class="nav-link dropdown-toggle"
             data-bs-toggle="dropdown" href="#" role="button">
            {{ moduleGroup.name }}
          </a>
          <ul [attr.aria-labelledby]="'moduleGroup' + i" class="dropdown-menu">
            <li *ngFor="let module of moduleGroup.modules">
              <a (click)="openModule(module); $event.preventDefault()" [attr.href]="'#' + moduleUrl(module)"
                 class="dropdown-item">{{ module.name }}</a>
            </li>
          </ul>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a (click)="logout()" class="nav-link" href="#"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="app-tabs" role="tablist">
  <div *ngFor="let tab of tabService.tabs$ | async; trackBy: trackTab"
       (auxclick)="tab.closable && $event.button === 1 && closeTab(tab, $event)"
       (click)="tabService.activate(tab)" (keydown.enter)="tabService.activate(tab)"
       [attr.aria-selected]="tab.url === (tabService.activeUrl$ | async)"
       [class.active]="tab.url === (tabService.activeUrl$ | async)" [title]="tab.title" class="app-tab" role="tab"
       tabindex="0">
    <i *ngIf="!tab.closable" class="bi bi-house-door"></i>
    <span class="app-tab-title">{{ tab.title }}</span>
    <button (click)="closeTab(tab, $event)" *ngIf="tab.closable" [attr.aria-label]="'Close ' + tab.title"
            class="app-tab-close" type="button"><i class="bi bi-x"></i></button>
  </div>
</div>
<div class="main-content" role="tabpanel">
  <router-outlet></router-outlet>
</div>
