<div *ngIf="warnings?.length" class="alert alert-warning d-flex align-items-start gap-2 mb-0 py-2" role="alert">
  <i aria-hidden="true" class="bi bi-exclamation-triangle-fill"></i>
  <div>
    <div class="fw-semibold">These numbers may be incomplete</div>
    <ul class="mb-0 ps-3">
      <li *ngFor="let w of warnings">{{ w }}</li>
    </ul>
  </div>
</div>
