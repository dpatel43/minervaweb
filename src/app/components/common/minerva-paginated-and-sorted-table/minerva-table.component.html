<div class="minerva-table-scroll">
  <table [dataSource]="dataSource" [matSortActive]="sortActive" class="grid-lines clickable-rows"
         mat-table matSort matSortDirection="desc">
    <ng-container *ngFor="let column of tableColumns" [matColumnDef]="column.valueProperty">
      <th *matHeaderCellDef [arrowPosition]="column.numeric ? 'before' : 'after'" [class.num]="column.numeric"
          mat-header-cell mat-sort-header scope="col">{{ column.columnLabel }}</th>
      <td *matCellDef="let element" [class.num]="column.numeric" mat-cell>{{ element[column.valueProperty] }}</td>
    </ng-container>

    <tr *matHeaderRowDef="displayedColumns; sticky: true" mat-header-row></tr>
    <tr (click)="rowClicked(row)" (keydown.enter)="rowClicked(row)" *matRowDef="let row; columns: displayedColumns;"
        mat-row tabindex="0"></tr>
    <tr *matNoDataRow class="mat-mdc-row">
      <td [attr.colspan]="displayedColumns.length" class="mat-mdc-cell results-empty">No records found.</td>
    </tr>
  </table>
</div>

<mat-paginator [pageSizeOptions]="[10, 20, 50]" [pageSize]="pageSize" showFirstLastButtons></mat-paginator>
